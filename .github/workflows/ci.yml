name: CI

on:
  # Branches only: a v* tag runs these same jobs through release.yml, before it publishes.
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Exact patch releases: older 22.x and 24.x have critical security bugs. Keep in step with
        # engines in package.json, .nvmrc and bench/app/Dockerfile.
        node: [22.23.4, 24.22.1]
    # For npm run test:integration. Same port as docker-compose.test.yml.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      # Runs unit and integration together, and enforces the 90% line threshold.
      - run: npm run coverage
      - run: npm run build
      # The demo builds from this checkout's src/ and Lua (decision 0024). Its browser test runs in
      # the demo job, once.
      - run: npm run demo:build
      # What npm users get: only dist/, the README, the licence and the changelog ship, with the
      # Lua scripts and both entry points (scripts/check-pack.js); package.json and exports are
      # valid (publint); and both entry points' types resolve for ESM consumers (attw).
      - run: npm run check:package
      # The prometheus entry point resolves from dist/, and the main one never loads prom-client.
      # The export list and TSDoc on every export are checked against dist/ too.
      - run: npx vitest run --project package
      # Runs the demo for real on each Node version, not just typechecks it.
      - name: Run the example
        timeout-minutes: 1
        run: |
          node --experimental-strip-types examples/basic/server.ts &
          until curl -s -o /dev/null http://localhost:3000/; do sleep 0.2; done
          examples/basic/hammer.sh 12 | tee hammer.txt
          grep -Eq '^[0-9]+ +429 ' hammer.txt
      # The milestone 2 demo: two copies share the CI Redis, so a client one limits, the other
      # limits too. Runs once per algorithm.
      - name: Run the example on Redis, two instances, every algorithm
        timeout-minutes: 2
        env:
          REDIS_URL: redis://localhost:6390
        run: examples/basic/demo-check.sh

  # The demo in a real browser: Playwright on Chromium loads the built site and runs a check
  # through the shipped Lua in wasmoon. A job of its own so Chromium installs once, not once per
  # Node version.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Smoke-tests the milestone 3 stack: nginx, three app instances and Redis, from
  # docker-compose.yml. A job of its own so the image builds once, not once per Node version.
  # It checks behaviour only. CI runners are shared and noisy, so no latency or throughput number
  # is compared here (decision 0017).
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The benchmark runner and analysis run on the host, and import yaml from devDependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Build the benchmark image and check it answers /healthz without Redis
        timeout-minutes: 5
        run: bench/app/image-check.sh
      # One client gets exactly its limit across three instances, for every algorithm.
      - name: Check the stack shares one limit, every algorithm
        timeout-minutes: 5
        run: bench/stack-check.sh token-bucket leaky-bucket fixed-window sliding-window-log sliding-window-counter
      # Quick k6 edges runs: the fixed window bursts across a boundary, the log never goes over,
      # and the analysis rebuilds the same summary from saved output.
      - name: Check the edges scenario
        timeout-minutes: 5
        run: bench/edges-check.sh
      # Milestone 4: Prometheus scrapes all three instances, the counters move under traffic, and
      # Grafana serves the dashboard without a login. Also checks stack:up leaves both out.
      - name: Check the observability profile
        timeout-minutes: 5
        run: bench/observe-check.sh
      # Milestone 4: Redis killed, then paused, under traffic. No request fails, the fallback
      # answers, and every instance is back on the primary after. No latency numbers (0017).
      - name: Check failure handling (chaos)
        timeout-minutes: 5
        run: bench/chaos-check.sh
      - name: Stop the stack
        if: always()
        run: npm run stack:down
