name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    # For npm run test:integration. Same port as docker-compose.test.yml.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      # Runs unit and integration together, and enforces the 90% line threshold.
      - run: npm run coverage
      - run: npm run build
      # tsc doesn't copy Lua; check the build step put the scripts where the modules read them.
      - name: Check the package ships its Lua scripts
        run: npm pack --dry-run 2>&1 | grep -q 'dist/algorithms/redis/token-bucket.lua'
      # Runs the demo for real on each Node version, not just typechecks it.
      - name: Run the example
        timeout-minutes: 1
        run: |
          node --experimental-strip-types examples/basic/server.ts &
          until curl -s -o /dev/null http://localhost:3000/; do sleep 0.2; done
          examples/basic/hammer.sh 12 | tee hammer.txt
          grep -Eq '^[0-9]+ +429 ' hammer.txt
      # The milestone 2 demo: two copies share the CI Redis, so a client one limits, the other
      # limits too. Runs once per algorithm.
      - name: Run the example on Redis, two instances, every algorithm
        timeout-minutes: 2
        env:
          REDIS_URL: redis://localhost:6390
        run: examples/basic/demo-check.sh
