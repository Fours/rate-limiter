# The stack's load balancer: plain round robin over three identical instances, no sticky
# sessions. That's the worst case for per-instance limits and the normal one for shared limits.
#
# One worker, because each worker keeps its own place in the rotation: with `auto`, 30 requests
# split 21/5/4. One worker splits them exactly 10/10/10. If nginx's CPU becomes the limit in the
# throughput benchmark (T3), revisit this.
worker_processes 1;
events {
  worker_connections 4096;
}

http {
  access_log off;

  upstream app {
    server app-1:3000;
    server app-2:3000;
    server app-3:3000;
    keepalive 64;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      # Appends the address nginx saw. The app trusts exactly one hop, so it reads that last
      # entry, and anything a client forged earlier in the header is ignored.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Never resend a request to another instance: it would be counted twice.
      proxy_next_upstream off;
    }
  }
}
