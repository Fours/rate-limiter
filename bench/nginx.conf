# The stack's load balancer: plain round robin over three identical instances, no sticky
# sessions. That's the worst case for per-instance limits and the normal one for shared limits.
#
# One worker, because each worker keeps its own place in the rotation: with `auto`, 30 requests
# split 21/5/4. One worker splits them exactly 10/10/10. If nginx's CPU becomes the limit in the
# throughput benchmark (T3), revisit this.
worker_processes 1;
events {
  worker_connections 4096;
}

http {
  access_log off;

  # Docker's DNS. nginx otherwise resolves app-1 to app-3 once, at startup, and an `up` that
  # recreates the apps but not nginx (npm run stack:observe after stack:up, say) can give them
  # each other's addresses: nginx then sends app-1's share to app-2 and none to app-3. Found in
  # milestone 4's close-out, when CI saw only 2 of 3 instances decide.
  resolver 127.0.0.11 valid=1s ipv6=off;

  upstream app {
    # `resolve` needs a shared zone. It re-resolves each name as the resolver's TTL allows.
    zone app 64k;
    server app-1:3000 resolve;
    server app-2:3000 resolve;
    server app-3:3000 resolve;
    keepalive 64;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      # Appends the address nginx saw. The app trusts exactly one hop, so it reads that last
      # entry, and anything a client forged earlier in the header is ignored.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Never resend a request to another instance: it would be counted twice.
      proxy_next_upstream off;
    }
  }
}
